# Long-horizon configuration: 24-hour simulation to demonstrate the
# Lyapunov queue tracking budget overshoot through multiple CI
# diurnal cycles. Used for the F5 long-horizon experiment.
simulation_time=240
warm_up_period=10
vm_load_check_interval=5
location_check_interval=5
file_log_enabled=true
deep_file_log_enabled=false

min_number_of_mobile_devices=100
max_number_of_mobile_devices=100
mobile_device_counter_size=100

wan_propagation_delay=0.1
lan_internal_delay=0.005
wlan_bandwidth=200
wan_bandwidth=15
gsm_bandwidth=0

number_of_host_on_cloud_datacenter=1
number_of_vm_on_cloud_host=4
core_for_cloud_vm=4
mips_for_cloud_vm=10000
ram_for_cloud_vm=32000
storage_for_cloud_vm=1000000

core_for_mobile_vm=0
mips_for_mobile_vm=0
ram_for_mobile_vm=0
storage_for_mobile_vm=0

# Run only LYAPUNOV (heuristic) and DRL for the long-horizon study.
orchestrator_policies=LYAPUNOV,DRL
simulation_scenarios=TWO_TIER_WITH_EO

attractiveness_L1_mean_waiting_time=500
attractiveness_L2_mean_waiting_time=300
attractiveness_L3_mean_waiting_time=120
