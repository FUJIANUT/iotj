# Carbon-aware settings for the 24-hour run.
# Budget set to a realistic 1500 gCO2eq for 24h (much tighter than the
# natural ~2000 emission level), so the Lyapunov queue actively binds
# and we can observe the queue tracking through diurnal CI cycles.
total_carbon_budget_g    = 250
lyapunov_v               = 100
alpha_latency            = 1.0
beta_migration           = 0.1
prediction_horizon_sec   = 60
carbon_traces_dir        = scripts/carbonmobile/data/carbon
mobility_traces_dir      = scripts/carbonmobile/data/mobility_4h
epoch_start_seconds      = 1735689600
orchestrator_mode        = CARBON_GREEDY
drl_host                 = 127.0.0.1
drl_port                 = 9999
ci_forecast_noise_sigma  = 0.0
